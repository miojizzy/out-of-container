# golangci-lint 配置 - 本项目推荐配置
# 文档: https://golangci-lint.run/usage/configuration/
version: 2

formatters:
  enable:
    - gofmt
    - goimports

linters:
  enable:
    - errcheck      # 检查未处理的错误返回值
    - govet         # Go vet 检查
    - staticcheck   # 静态分析检查
    - unused        # 检查未使用的代码
    - ineffassign   # 检测无效赋值
    - gocyclo       # 检查圈复杂度
    - goconst       # 检查重复字符串
    - gocritic      # 代码风格和性能建议
    - revive        # 代码风格检查器
    - misspell      # 检查拼写错误
    - dupl          # 检查重复代码

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: false
    # 排除一些常见的不需要检查的函数
    ignore: fmt:.*,io/ioutil:^Read.*

  govet:
    enable-all: true
    # 禁用过于严格的检查
    disable:
      - shadow
      - unusedwrite
      - fieldalignment  # 字段对齐是优化问题，不是错误

  gocyclo:
    min-complexity: 20  # 提高复杂度阈值，降低警告频率

  goconst:
    min-len: 3
    min-occurrences: 5  # 提高重复阈值

  dupl:
    threshold: 150  # 提高重复代码阈值

  gocritic:
    enabled-checks:
      - appendCombine
      - equalFold
      - hugeParam
      - rangeValCopy
      - unnecessaryBlock
    # 禁用过于严格的检查器
    disabled-checks:
      - unnamedResult      # 命名返回值不是强制的
      - exitAfterDefer     # 这个检查过于严格，需要重构代码

  revive:
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: error-return
      - name: error-strings
      - name: error-naming
      # - name: exported  # 导出注释规则过于严格，暂时禁用
      - name: if-return
      - name: increment-decrement
      - name: var-naming
      - name: var-declaration
      # - name: package-comments  # 包注释规则过于严格，暂时禁用
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: indent-error-flow
      - name: errorf
      - name: empty-block

  misspell:
    locale: US

issues:
  exclude-rules:
    # 测试文件允许宽松检查
    - path: _test\.go
      linters:
        - errcheck      # 测试中的某些错误可以忽略
        - dupl          # 测试代码重复是正常的
        - gocyclo       # 测试代码可以复杂一些
        - revive        # 测试文件不需要严格的 revive 检查
        - gocritic      # 测试文件忽略 gocritic 检查
        - goconst       # 测试文件忽略重复字符串检查

  # 排除的目录
  exclude-dirs:
    - vendor
    - testdata

  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-generated: strict

run:
  timeout: 5m
  modules-download-mode: readonly
  concurrency: 4
