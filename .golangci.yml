# golangci-lint 配置 - 本项目推荐配置
# 文档: https://golangci-lint.run/usage/configuration/

linters:
  enable:
    - errcheck      # 检查未处理的错误返回值
    - govet         # Go vet 检查
    - staticcheck   # 静态分析检查
    - unused        # 检查未使用的代码
    - gosimple      # 代码简化建议
    - ineffassign   # 检测无效赋值
    - gocyclo       # 检查圈复杂度
    - goconst       # 检查重复字符串
    - gocritic      # 代码风格和性能建议
    - gofmt         # 检查代码格式化
    - goimports     # 检查 imports 排序
    - revive        # 代码风格检查器
    - misspell      # 检查拼写错误
    - dupl          # 检查重复代码

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: false

  govet:
    enable-all: true
    # 禁用过于严格的检查
    disable:
      - shadow
      - unusedwrite

  gocyclo:
    min-complexity: 15

  goconst:
    min-len: 3
    min-occurrences: 3

  dupl:
    threshold: 100

  gocritic:
    enabled-checks:
      - appendCombine
      - equalFold
      - hugeParam
      - rangeValCopy
      - unnamedResult
      - unnecessaryBlock

  revive:
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: exported
      - name: if-return
      - name: increment-decrement
      - name: var-naming
      - name: var-declaration
      - name: package-comments
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: indent-error-flow
      - name: errorf
      - name: empty-block

  misspell:
    locale: US

issues:
  exclude-rules:
    # 测试文件允许宽松检查
    - path: _test\.go
      linters:
        - errcheck
        - dupl
        - gocyclo

  # 排除的目录
  exclude-dirs:
    - vendor
    - testdata

  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-generated: strict

run:
  timeout: 5m
  modules-download-mode: readonly
  concurrency: 4

severity:
  default-severity: error
  rules:
    - linters:
        - dupl
        - misspell
      severity: warning
    - linters:
        - gocyclo
        - goconst
      severity: info
