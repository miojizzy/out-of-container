name: Tag

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: '手动指定完整 tag (例如 v2.00.000)'
        required: true
        type: string

# 串行化: 同一时间只允许一个 tag 工作流运行，后续排队等待
concurrency:
  group: tag-main
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    # PR 合并时自动运行，或手动触发时运行
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.merged == true
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 拉取远端最新状态，确保 tag 计算基于最新视图
    - name: Fetch latest tags
      run: |
        git fetch origin --tags --force
        git fetch origin main

    - name: Determine tag
      id: version
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          # 手动模式: 校验输入 tag 格式
          TAG="${{ github.event.inputs.tag }}"
          .github/scripts/tag_version.sh validate "$TAG"
          echo "new_version=$TAG" >> $GITHUB_OUTPUT
          echo "手动指定 tag: $TAG"
        else
          # 自动模式: 计算下一个 patch 版本
          TAG=$(.github/scripts/tag_version.sh next)
          echo "new_version=$TAG" >> $GITHUB_OUTPUT
          echo "自动计算 tag: $TAG"
        fi

    - name: Check tag not exists
      run: |
        TAG="${{ steps.version.outputs.new_version }}"
        if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
          echo "ERROR: tag '$TAG' 已存在于远端，中止执行" >&2
          exit 1
        fi
        echo "确认 tag '$TAG' 不存在，继续"

    - name: Create and push tag
      run: |
        TAG="${{ steps.version.outputs.new_version }}"
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        # 在 main 最新提交上创建 annotated tag
        git tag -a "$TAG" -m "Release: $TAG"

        # 推送精确 ref，避免误推其他内容
        git push origin "refs/tags/$TAG"
        echo "成功推送 tag: $TAG"

  release:
    needs: tag
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.new_version }}
    permissions:
      contents: write
