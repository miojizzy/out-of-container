name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Get version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build server binaries
        run: |
          # Linux AMD64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w -X main.Version=${{ steps.get_version.outputs.VERSION }} -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o exec-server-linux-amd64 ./cmd/server

          # Linux ARM64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
            -ldflags="-s -w -X main.Version=${{ steps.get_version.outputs.VERSION }} -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o exec-server-linux-arm64 ./cmd/server

      - name: Build client binaries
        run: |
          # Linux AMD64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w" \
            -o exec-client-linux-amd64 ./cmd/client

          # Linux ARM64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
            -ldflags="-s -w" \
            -o exec-client-linux-arm64 ./cmd/client

      - name: Generate checksums
        run: |
          sha256sum exec-server-linux-amd64 > exec-server-linux-amd64.sha256
          sha256sum exec-server-linux-arm64 > exec-server-linux-arm64.sha256
          sha256sum exec-client-linux-amd64 > exec-client-linux-amd64.sha256
          sha256sum exec-client-linux-arm64 > exec-client-linux-arm64.sha256

          # Combine all checksums
          cat *.sha256 > checksums.txt

      - name: Create release notes
        id: release_notes
        run: |
          cat > release_notes.md << 'EOF'
          ## exec-server ${{ steps.get_version.outputs.VERSION }}

          容器远程命令执行系统 - Phase 1 正式发布

          ### 功能特性

          - ✅ **安全性**
            - API Token 认证（crypto/rand + constant-time 比较）
            - 白名单控制（literal + regex）
            - 工作目录限制（防止路径跳转）
            - Shell 元字符检测（防止命令注入）
            - 审计日志（JSONL 格式，自动轮转）

          - ✅ **性能与可靠性**
            - 并发控制（最大 5 并发）
            - 超时控制（30s）
            - 输出大小限制（10MB）
            - 进程组清理
            - 配置热重载（5s 检查间隔）

          - ✅ **易用性**
            - 单二进制部署
            - 配置文件外部化
            - 兼容老系统（CentOS 7 / glibc 2.17+）

          ### 安装

          ```bash
          # Linux x86_64
          curl -L -o exec-server https://github.com/miojizzy/out-of-container/releases/download/${{ steps.get_version.outputs.VERSION }}/exec-server-linux-amd64
          chmod +x exec-server

          curl -L -o exec-client https://github.com/miojizzy/out-of-container/releases/download/${{ steps.get_version.outputs.VERSION }}/exec-client-linux-amd64
          chmod +x exec-client
          ```

          ### 快速开始

          1. 初始化配置：
             ```bash
             ./exec-server --init
             ```

          2. 编辑配置文件（`~/.config/exec-server/config.yaml`）设置白名单

          3. 启动 server：
             ```bash
             ./exec-server --config ~/.config/exec-server/config.yaml
             ```

          4. 使用 client 执行命令：
             ```bash
             ./exec-client -command make -cwd /path/to/project
             ```

          ### 文档

          - [README.md](https://github.com/miojizzy/out-of-container/blob/main/README.md) - 完整使用文档
          - [设计文档](https://github.com/miojizzy/out-of-container/blob/main/design/zhaozeyu-main-design-20260401-050215.md) - 架构设计和评审

          ### 下一步计划

          - Phase 2: 异步执行模式
          - Phase 3: SSE 流式输出

          ---

          **Built with ❤️ for AI-assisted development**
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: release_notes.md
          files: |
            exec-server-linux-amd64
            exec-server-linux-arm64
            exec-client-linux-amd64
            exec-client-linux-arm64
            checksums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
