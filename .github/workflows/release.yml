name: Release

on:
  push:
    tags:
      - 'v[0-9].[0-9]+.[0-9]+'
  workflow_call:
    inputs:
      tag:
        description: '要发布的 tag (例如 v1.0.0)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: '手动指定要发布的 tag (例如 v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && github.ref || inputs.tag }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Get version
        id: get_version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # push tag 触发：直接使用触发此工作流的 tag
            VERSION="${GITHUB_REF_NAME}"
          else
            # workflow_call 或 workflow_dispatch 触发：使用输入的 tag
            VERSION="${{ inputs.tag }}"
          fi
          echo "VERSION=${VERSION#v}" >> $GITHUB_OUTPUT
          echo "TAG=${VERSION}" >> $GITHUB_OUTPUT
          echo "构建版本: $VERSION"

      - name: Build server binaries
        run: |
          # Linux AMD64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w -X main.Version=${{ steps.get_version.outputs.VERSION }} -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o ooc-server-linux-amd64 ./cmd/ooc-server

          # Linux ARM64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
            -ldflags="-s -w -X main.Version=${{ steps.get_version.outputs.VERSION }} -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o ooc-server-linux-arm64 ./cmd/ooc-server

      - name: Build client binaries
        run: |
          # Linux AMD64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w -X main.Version=${{ steps.get_version.outputs.VERSION }} -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o ooc-client-linux-amd64 ./cmd/ooc-client

          # Linux ARM64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
            -ldflags="-s -w -X main.Version=${{ steps.get_version.outputs.VERSION }} -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o ooc-client-linux-arm64 ./cmd/ooc-client

      - name: Generate checksums
        run: |
          sha256sum ooc-server-linux-amd64 > ooc-server-linux-amd64.sha256
          sha256sum ooc-server-linux-arm64 > ooc-server-linux-arm64.sha256
          sha256sum ooc-client-linux-amd64 > ooc-client-linux-amd64.sha256
          sha256sum ooc-client-linux-arm64 > ooc-client-linux-arm64.sha256

          cat *.sha256 > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.TAG }}
          name: Release ${{ steps.get_version.outputs.TAG }}
          generate_release_notes: true
          files: |
            ooc-server-linux-amd64
            ooc-server-linux-arm64
            ooc-client-linux-amd64
            ooc-client-linux-arm64
            checksums.txt
            skill/ooc-exec/SKILL.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
