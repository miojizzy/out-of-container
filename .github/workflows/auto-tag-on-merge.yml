name: Auto Tag on Merge

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  tag:
    runs-on: ubuntu-latest
    # 仅在 PR 被合并时运行
    if: github.event.pull_request.merged == true
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # 获取所有历史记录和标签

    - name: Get next version
      id: version
      run: |
        # 获取最新标签
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.00.000")
        echo "Latest tag: $LATEST_TAG"

        # 解析版本号（处理新格式：v1.01.001）
        VERSION_STR=$(echo $LATEST_TAG | sed 's/v//')
        # 使用 awk 分割版本号，避免 shell 兼容性问题
        MAJOR=$(echo "$VERSION_STR" | awk -F'.' '{print $1}')
        MINOR=$(echo "$VERSION_STR" | awk -F'.' '{print $2}')
        PATCH=$(echo "$VERSION_STR" | awk -F'.' '{print $3}')

        # 移除前导零，防止被当作八进制数处理
        MAJOR=$((10#$MAJOR))
        MINOR=$((10#$MINOR))
        PATCH=$((10#$PATCH))

        # 增加补丁版本号
        PATCH=$((PATCH + 1))
        # 格式化版本号：一级一位，二级两位用0填首位，三级三位用0填首位
        NEW_VERSION="v$MAJOR.$(printf "%02d" $MINOR).$(printf "%03d" $PATCH)"

        echo "New version: $NEW_VERSION"
        echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

        # 保存到环境变量
        echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

    - name: Create and push tag
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        # 创建注释标签
        git tag -a "${{ steps.version.outputs.new_version }}" -m "Auto-tagged release: ${{ steps.version.outputs.new_version }}"

        # 推送标签
        git push origin "${{ steps.version.outputs.new_version }}"

    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.version.outputs.new_version }}
        release_name: Release ${{ steps.version.outputs.new_version }}
        body: |
          自动发布版本 ${{ steps.version.outputs.new_version }}

          此版本由 GitHub Actions 在 PR 合并时自动创建。
        draft: false
        prerelease: false