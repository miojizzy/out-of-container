name: Auto Tag on Merge

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  tag:
    runs-on: ubuntu-latest
    # 仅在 PR 被合并时运行
    if: github.event.pull_request.merged == true
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0 # 获取所有历史记录和标签

    - name: Get next version
      id: version
      run: |
        # 获取最新标签
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
        echo "Latest tag: $LATEST_TAG"

        # 解析版本号
        VERSION_PARTS=($(echo $LATEST_TAG | sed 's/v//' | tr '.' ' '))
        MAJOR=${VERSION_PARTS[0]:-0}
        MINOR=${VERSION_PARTS[1]:-0}
        PATCH=${VERSION_PARTS[2]:-0}

        # 增加补丁版本号
        PATCH=$((PATCH + 1))
        NEW_VERSION="v$MAJOR.$MINOR.$PATCH"

        echo "New version: $NEW_VERSION"
        echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

        # 保存到环境变量
        echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

    - name: Create and push tag
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        # 创建注释标签
        git tag -a "${{ steps.version.outputs.new_version }}" -m "Auto-tagged release: ${{ steps.version.outputs.new_version }}"

        # 推送标签
        git push origin "${{ steps.version.outputs.new_version }}"

    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.version.outputs.new_version }}
        release_name: Release ${{ steps.version.outputs.new_version }}
        body: |
          自动发布版本 ${{ steps.version.outputs.new_version }}

          此版本由 GitHub Actions 在 PR 合并时自动创建。
        draft: false
        prerelease: false